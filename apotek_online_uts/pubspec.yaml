name: apotek_online_uts
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  http: ^1.2.0
  intl: ^0.20.3
  url_launcher: ^6.3.1
  uuid: ^4.3.3
  geolocator: ^14.1.2
  geocoding: ^5.0.1
  google_maps_flutter: ^2.10.0
  shared_preferences: ^2.5.6
  google_sign_in: ^7.2.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
